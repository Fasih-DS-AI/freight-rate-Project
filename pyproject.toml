[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-rate"
version = "0.1.0"
description = "Freight rate prediction pipeline (Spotter ML assessment)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
